name: update-packages

on:
  schedule:
    - cron: "23 4 2-31/3 * *"
  workflow_dispatch:

concurrency:
  group: update-packages

jobs:
  update-packages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joschi/forgejo-nix:latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update packages and open pull request
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          export PATH="$(nix build --no-link --print-out-paths nixpkgs#nix-update)/bin:$PATH"

          failed=()

          bump() {
            attr="$1"
            shift
            echo "::group::${attr}"
            if nix-update --version=unstable --flake "$@" "${attr}"; then
              echo "bumped ${attr}"
            else
              echo "FAILED ${attr}"
              failed+=("${attr}")
            fi
            echo "::endgroup::"
          }

          bump pelican-wings
          bump dmemcg-booster

          latest=$(curl -fsSL https://pkgs.fluxer.com/desktop/canary/linux/x64/version.json \
            | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [[ -z "${latest}" ]]; then
            echo "FAILED to read fluxer version feed"
            failed+=("fluxer-canary(feed)")
          else
            bump fluxer-canary --version "${latest}"
          fi

          if ! git diff --quiet -- pkgs; then
            git config user.name "nixos-config-bot"
            git config user.email "bot@csd4ni3l.hu"
            git checkout -B automation/update-packages
            git add pkgs
            git commit -m "chore(pkgs): update packages"

            auth=$(printf 'x-access-token:%s' "${UPDATE_TOKEN}" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            host=$(git remote get-url origin | sed -E 's#^https?://([^@]*@)?([^/]+)/.*#\2#')
            git config "http.https://${host}/.extraheader" "AUTHORIZATION: basic ${auth}"
            git push --force origin automation/update-packages

            {
              echo 'Scheduled `nix-update` run for `pelican-wings`, `dmemcg-booster` and'
              echo '`fluxer-canary` (version read from the Fluxer version.json feed).'
              echo
              git log --oneline origin/main..HEAD
            } > pr-body.txt
            bash scripts/open-pr.sh "chore(pkgs): update packages" pr-body.txt
          else
            echo "all packages already current"
          fi

          if (( ${#failed[@]} )); then
            echo "failed: ${failed[*]}"
            exit 1
          fi
