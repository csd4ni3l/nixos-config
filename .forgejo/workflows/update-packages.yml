name: update-packages

on:
  schedule:
    - cron: "23 4 2-31/3 * *"
  workflow_dispatch:

concurrency:
  group: update-packages

jobs:
  update-packages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joschi/forgejo-nix:latest@sha256:db8e7f1653966695d3aef3b749fd0d41e1aeb2d7e957b4e331f374fa7a8e137a
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update packages and open pull request
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          set -euo pipefail

          # NOTE: nix-update 1.16.0 breaks on Nix 2.35's lazy flake sources;
          # pin its bundled nix until the upstream fix lands.
          export PATH="$(nix build --no-link --print-out-paths --impure --expr '
            let pkgs = (builtins.getFlake "nixpkgs").legacyPackages.${builtins.currentSystem};
            in pkgs.nix-update.override {nix = pkgs.nixVersions.nix_2_34;}
          ')/bin:$PATH"

          failed=()
          current=()
          updated_rows=()

          package_version() {
            nix eval --raw ".#packages.x86_64-linux.$1.version" 2>/dev/null || echo "(unknown)"
          }

          bump() {
            attr="$1"
            shift
            echo "::group::${attr}"
            before=$(package_version "${attr}")
            if nix-update --version=unstable --flake "$@" "${attr}"; then
              after=$(package_version "${attr}")
              if [[ "${before}" == "${after}" ]]; then
                echo "${attr}: ${after} (current)"
                current+=("${attr}")
              else
                echo "${attr}: ${before} -> ${after}"
                updated_rows+=("| \`${attr}\` | \`${before}\` | \`${after}\` |")
              fi
            else
              echo "FAILED ${attr}"
              failed+=("${attr}")
            fi
            echo "::endgroup::"
          }

          bump pelican-wings
          bump dmemcg-booster
          bump proton-drive-cli

          # artcraft
          bump craft-wordcraft
          bump craft-deckcraft
          bump craft-gridcraft
          bump craft-pdfcraft
          bump craft-vectorcraft

          latest=$(curl -fsSL https://pkgs.fluxer.com/desktop/canary/linux/x64/version.json \
            | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [[ -z "${latest}" ]]; then
            echo "FAILED to read fluxer version feed"
            failed+=("fluxer-canary(feed)")
          else
            bump fluxer-canary --version "${latest}"
          fi

          if ! git diff --quiet -- pkgs; then
            git config user.name "nixos-config-bot"
            git config user.email "bot@csd4ni3l.hu"
            git checkout -B automation/update-packages
            git add pkgs
            git commit -m "chore(pkgs): update packages"

            auth=$(printf 'x-access-token:%s' "${UPDATE_TOKEN}" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            host=$(git remote get-url origin | sed -E 's#^https?://([^@]*@)?([^/]+)/.*#\2#')
            git config "http.https://${host}/.extraheader" "AUTHORIZATION: basic ${auth}"
            git push --force origin automation/update-packages

            {
              echo 'Scheduled `nix-update` run for `pkgs`.'
              echo
              if (( ${#updated_rows[@]} )); then
                echo '### Package updates'
                echo
                echo '| Package | Before | After |'
                echo '| --- | --- | --- |'
                printf '%s\n' "${updated_rows[@]}"
                echo
              else
                echo 'No package version changes.'
                echo
              fi
              if (( ${#current[@]} )); then
                echo "Already current: $(printf '`%s` ' "${current[@]}")"
                echo
              fi
              if (( ${#failed[@]} )); then
                echo '### Failed updates'
                echo
                printf -- '- `%s`\n' "${failed[@]}"
                echo
              fi
              echo '### Commits'
              echo
              git log --oneline origin/main..HEAD
            } > pr-body.txt
            bash scripts/open-pr.sh "chore(pkgs): update packages" pr-body.txt
          else
            echo "all packages already current"
          fi

          if (( ${#failed[@]} )); then
            echo "failed: ${failed[*]}"
            exit 1
          fi
