name: update-flake

on:
  schedule:
    - cron: "17 3 1-31/3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake

jobs:
  update-flake:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joschi/forgejo-nix:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update flake inputs
        run: nix flake update

      - name: Validate host evaluations
        run: |
          set -eu
          for host in framework16 vps homelabvm publicvm anotherpublicvm; do
            echo "== evaluating ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: Create pull request
        uses: code.forgejo.org/peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_TOKEN }}
          base: main
          branch: automation/update-flake
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore(flake): update inputs"
          committer: nixos-config-bot <bot@csd4ni3l.hu>
          author: nixos-config-bot <bot@csd4ni3l.hu>
          title: "chore(flake): update inputs"
          body: |
            Scheduled `nix flake update`.

            Host evaluations passed before this PR was opened.
