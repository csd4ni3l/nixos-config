name: update-flake

on:
  schedule:
    - cron: "17 3 1-31/3 * *"
  workflow_dispatch:

concurrency:
  group: update-flake

jobs:
  update-flake:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joschi/forgejo-nix:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update flake inputs
        run: nix flake update

      - name: Validate host evaluations
        run: |
          set -eu
          for host in framework16 vps homelabvm publicvm anotherpublicvm; do
            echo "== evaluating ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: Open pull request
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          set -eu
          if git diff --quiet flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi

          git config user.name "nixos-config-bot"
          git config user.email "bot@csd4ni3l.hu"
          git checkout -B automation/update-flake
          git add flake.lock
          git commit -m "chore(flake): update inputs"

          auth=$(printf 'x-access-token:%s' "${UPDATE_TOKEN}" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          host=$(git remote get-url origin | sed -E 's#^https?://([^@]*@)?([^/]+)/.*#\2#')
          git config "http.https://${host}/.extraheader" "AUTHORIZATION: basic ${auth}"
          git push --force origin automation/update-flake

          {
            echo 'Scheduled `nix flake update`.'
            echo
            echo "Host evaluations passed before this PR was opened."
            echo
            git log --oneline origin/main..HEAD
          } > pr-body.txt
          bash scripts/open-pr.sh "chore(flake): update inputs" pr-body.txt
